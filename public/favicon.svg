<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Neon Glow Gradient -->
    <linearGradient id="neon-cyan-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <!-- Electric Blue Accent Gradient -->
    <linearGradient id="blue-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Rounded Base Icon Container -->
  <rect x="4" y="4" width="120" height="120" rx="32" fill="url(#bg-grad)" stroke="url(#neon-cyan-green)" stroke-width="3" />

  <!-- Subtle Inner Ring -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1.5" />

  <!-- Precision Crosshair Target Grid (Subtle) -->
  <circle cx="64" cy="64" r="38" fill="none" stroke="rgba(52, 211, 153, 0.15)" stroke-dasharray="3,3" stroke-width="1.5" />
  <line x1="64" y1="20" x2="64" y2="28" stroke="#34D399" stroke-width="2" stroke-linecap="round" opacity="0.8" />
  <line x1="64" y1="100" x2="64" y2="108" stroke="#34D399" stroke-width="2" stroke-linecap="round" opacity="0.8" />
  <line x1="20" y1="64" x2="28" y2="64" stroke="#06B6D4" stroke-width="2" stroke-linecap="round" opacity="0.8" />
  <line x1="100" y1="64" x2="108" y2="64" stroke="#06B6D4" stroke-width="2" stroke-linecap="round" opacity="0.8" />

  <!-- QA Shield Emblem -->
  <path 
    d="M64 26 L92 37 C92 65 78 87 64 98 C50 87 36 65 36 37 Z" 
    fill="#0F172A" 
    stroke="url(#neon-cyan-green)" 
    stroke-width="5" 
    stroke-linejoin="round"
    filter="url(#neon-glow)"
  />

  <!-- Inner High-Contrast Precision Checkmark -->
  <path 
    d="M49 61 L59 72 L79 48" 
    fill="none" 
    stroke="#FFFFFF" 
    stroke-width="6.5" 
    stroke-linecap="round" 
    stroke-linejoin="round" 
  />

  <!-- Top-Right Sparkle Node representing Precision Quality Assurance -->
  <circle cx="92" cy="36" r="4.5" fill="#34D399" filter="url(#neon-glow)" />
  <circle cx="92" cy="36" r="2.5" fill="#FFFFFF" />
</svg>
